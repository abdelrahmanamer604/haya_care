name: haya_care
description: "Haya Care - Comprehensive Healthcare Platform for Hypertension & Diabetes Patients"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  animate_do: ^5.1.0
  fl_chart: ^1.3.1
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logos/
    - assets/images/
    - assets/icons/
